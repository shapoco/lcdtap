<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KJ53WNQ22G"></script>
<script>
  var remoteHost = window.location.hostname;
  if (remoteHost == "localhost") {
    console.log(`Google Analytics disabled on: '${remoteHost}'`);
  }
  else {
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-KJ53WNQ22G');
  }
</script>

<title>LcdTap Monitor</title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="shortcut icon" href="../favicon.ico">
<link rel="stylesheet" href="monitor.css">
</head>
<body>

<div id="app"></div>

<script type="module">
'use strict';

import { serial as webSerialPolyfill } from "https://cdn.jsdelivr.net/npm/web-serial-polyfill@1.0.15";
import { SerialConnection } from './serial_conn.js';
import { initApp } from './monitor.js';

initApp({
  conn: new SerialConnection(),
  title: 'LcdTap Monitor',
  transports: [
    { id: 'webserial', label: 'WebSerial' },
    { id: 'webusb',    label: 'WebUSB' },
  ],
  defaultTransport: ('serial' in navigator) ? 'webserial' : 'webusb',
  getConnectArg: (t) => (t === 'webusb') ? webSerialPolyfill : navigator.serial,
});
</script>
</body>
</html>
